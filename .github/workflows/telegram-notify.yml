name: Notify Telegram

on:
  push:
    branches: ["**"]
  watch:          # star / unstar
  fork:
  issues:
  pull_request:
  release:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          # push
          PUSH_REF: ${{ github.ref_name }}
          PUSH_AUTHOR: ${{ github.event.head_commit.author.name }}
          PUSH_MSG: ${{ github.event.head_commit.message }}
          PUSH_COMPARE: ${{ github.event.compare }}
          # watch
          WATCH_ACTION: ${{ github.event.action }}
          # fork
          FORKEE: ${{ github.event.forkee.full_name }}
          # issues
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          # pull_request
          PR_ACTION: ${{ github.event.action }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # release
          REL_ACTION: ${{ github.event.action }}
          REL_NAME: ${{ github.event.release.name }}
          REL_URL: ${{ github.event.release.html_url }}
        run: |
          case "$EVENT" in
            push)
              TEXT=$(printf '🔔 %s\n🚀 push by %s on %s\n%s\n%s' "$REPO" "$PUSH_AUTHOR" "$PUSH_REF" "$PUSH_MSG" "$PUSH_COMPARE")
              ;;
            watch)
              if [ "$WATCH_ACTION" = "started" ]; then
                TEXT=$(printf '⭐ %s\n%s starred the repo' "$REPO" "$SENDER")
              else
                TEXT=$(printf '👁 %s\n%s unwatched the repo' "$REPO" "$SENDER")
              fi
              ;;
            fork)
              TEXT=$(printf '🍴 %s\nforked by %s' "$REPO" "$SENDER")
              ;;
            issues)
              TEXT=$(printf '📝 %s\nissue %s by %s\n#%s %s\n%s' "$REPO" "$ISSUE_ACTION" "$SENDER" "$ISSUE_NUM" "$ISSUE_TITLE" "$ISSUE_URL")
              ;;
            pull_request)
              TEXT=$(printf '🔀 %s\nPR %s by %s\n#%s %s\n%s' "$REPO" "$PR_ACTION" "$SENDER" "$PR_NUM" "$PR_TITLE" "$PR_URL")
              ;;
            release)
              TEXT=$(printf '🏷 %s\nrelease %s\n%s\n%s' "$REPO" "$REL_ACTION" "$REL_NAME" "$REL_URL")
              ;;
            *)
              TEXT=$(printf 'ℹ️ %s\nevent: %s' "$REPO" "$EVENT")
              ;;
          esac
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
