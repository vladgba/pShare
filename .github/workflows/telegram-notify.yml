name: Notify Telegram

on:
  push:
    branches: ["**"]
  watch:          # star / unstar
  fork:
  issues:
  pull_request:
  release:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          # push
          PUSH_REF: ${{ github.ref_name }}
          PUSH_AUTHOR: ${{ github.event.head_commit.author.name }}
          PUSH_MSG: ${{ github.event.head_commit.message }}
          PUSH_COMPARE: ${{ github.event.compare }}
          # watch
          WATCH_ACTION: ${{ github.event.action }}
          # fork
          FORKEE: ${{ github.event.forkee.full_name }}
          # issues
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          # pull_request
          PR_ACTION: ${{ github.event.action }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # release
          REL_ACTION: ${{ github.event.action }}
          REL_NAME: ${{ github.event.release.name }}
          REL_URL: ${{ github.event.release.html_url }}
        run: |
          case "$EVENT" in
            push)
              TEXT="🔔 ${REPO}\n🚀 push by ${PUSH_AUTHOR} on ${PUSH_REF}\n${PUSH_MSG}\n${PUSH_COMPARE}"
              ;;
            watch)
              if [ "$WATCH_ACTION" = "started" ]; then
                TEXT="⭐ ${REPO}\n${SENDER} starred the repo"
              else
                TEXT="👁 ${REPO}\n${SENDER} unwatched the repo"
              fi
              ;;
            fork)
              TEXT="🍴 ${REPO}\nforked by ${SENDER} → ${FORKEE}"
              ;;
            issues)
              TEXT="📝 ${REPO}\nissue ${ISSUE_ACTION} by ${SENDER}\n#${ISSUE_NUM} ${ISSUE_TITLE}\n${ISSUE_URL}"
              ;;
            pull_request)
              TEXT="🔀 ${REPO}\nPR ${PR_ACTION} by ${SENDER}\n#${PR_NUM} ${PR_TITLE}\n${PR_URL}"
              ;;
            release)
              TEXT="🏷 ${REPO}\nrelease ${REL_ACTION}\n${REL_NAME}\n${REL_URL}"
              ;;
            *)
              TEXT="ℹ️ ${REPO}\nevent: ${EVENT}"
              ;;
          esac
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null
